name: Trace4Kids
options:
  bundleIdPrefix: com.jondoesflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Trace4Kids:
    type: application
    platform: iOS
    sources:
      - path: Trace4Kids
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondoesflow.trace4kids
        PRODUCT_NAME: Trace4Kids
        # iPhone and iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # The sample picture is only for UI tests and screenshots; it never ships.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: DemoPicture.png
    info:
      path: Trace4Kids/Info.plist
      properties:
        CFBundleDisplayName: Trace4Kids
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        NSCameraUsageDescription: Trace4Kids shows your paper through the camera so you can trace the picture. Nothing is recorded or saved.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false

  Trace4KidsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Trace4KidsTests
    dependencies:
      - target: Trace4Kids
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondoesflow.trace4kids.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Trace4Kids.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Trace4Kids
        BUNDLE_LOADER: $(TEST_HOST)

  Trace4KidsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Trace4KidsUITests
    dependencies:
      - target: Trace4Kids
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondoesflow.trace4kids.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Trace4Kids

schemes:
  Trace4Kids:
    build:
      targets:
        Trace4Kids: all
        Trace4KidsTests: [test]
        Trace4KidsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Trace4KidsTests
        - Trace4KidsUITests
